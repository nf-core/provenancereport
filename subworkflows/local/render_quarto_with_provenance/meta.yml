# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "RENDER_QUARTO_WITH_PROVENANCE"
description: Prepare a Quarto notebook for runtime package provenance and render it
keywords:
  - quarto
  - notebook
  - provenance
  - report
components:
  - quarto/prepare
  - quarto/notebook
input:
  - notebook:
      type: file
      description: Quarto notebook together with its metadata map
      pattern: "*.qmd"
  - parameters:
      type: map
      description: Parameters made available while rendering the notebook
  - input_files:
      type: list
      description: Files staged as inputs to the notebook
  - extensions:
      type: list
      description: Optional Quarto extensions
output:
  - html:
      type: file
      description: Rendered HTML report together with its metadata map
      pattern: "*.html"
  - notebook:
      type: file
      description: Prepared Quarto notebook together with its metadata map
      pattern: "*.qmd"
  - params_yaml:
      type: file
      description: Parameters passed to the Quarto notebook
      pattern: "params.yml"
  - artifacts:
      type: file
      description: Files generated by the notebook in its artifacts directory
  - extensions:
      type: directory
      description: Quarto extensions used while rendering
  - runtime_environment:
      type: list
      description: Runtime environment used to render the notebook
  - versions:
      type: file
      description: Package versions captured during notebook execution
      pattern: "versions.yml"
  - versions_quarto:
      type: list
      description: Quarto version information
  - versions_papermill:
      type: list
      description: Papermill version information
authors:
  - "@antoniasaracco"
