# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "quarto_prepare"
description: Append package-version capture to a temporary copy of a Quarto notebook
keywords:
  - quarto
  - notebook
  - provenance
  - versions
tools:
  - quarto_prepare:
      description: Prepare a Quarto notebook for runtime package-version capture
      homepage: https://github.com/nf-core/provenancereport
      documentation: https://nf-co.re/provenancereport/usage
      licence: ["MIT"]
      identifier: ""
input:
  - - meta:
        type: map
        description: Groovy Map containing report information
    - notebook:
        type: file
        description: Quarto or R Markdown notebook to prepare
        pattern: "*.{qmd,Rmd,rmd}"
        ontologies: []
output:
  notebook:
    - - meta:
          type: map
          description: Groovy Map containing report information
      - "*.{qmd,Rmd,rmd}":
          type: file
          description: Prepared notebook copy containing a guarded package-version fallback cell
          pattern: "*.{qmd,Rmd,rmd}"
          ontologies: []
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - python --version | sed "s/^Python //":
          type: eval
          description: The expression used to obtain the Python version
  versions_pyyaml:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pyyaml:
          type: string
          description: The name of the tool
      - python -c "import yaml; print(yaml.__version__)":
          type: eval
          description: The expression used to obtain the PyYAML version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - python --version | sed "s/^Python //":
          type: eval
          description: The expression used to obtain the Python version
    - - ${task.process}:
          type: string
          description: The name of the process
      - pyyaml:
          type: string
          description: The name of the tool
      - python -c "import yaml; print(yaml.__version__)":
          type: eval
          description: The expression used to obtain the PyYAML version
authors:
  - "@antoniasaracco"
maintainers:
  - "@antoniasaracco"
