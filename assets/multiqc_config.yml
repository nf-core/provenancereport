report_comment: >
  This audit report was generated by the nf-core/provenancereport pipeline. It records
  the run configuration, report-rendering environment, and software versions.

report_section_order:
  input_samplesheet:
    order: 100000
  file_checksums:
    order: 99999
  pipeline_outputs:
    order: 99998
  runtime_environment:
    order: 99997
  "nf-core-provenancereport-r-session-info":
    order: 99996
  "nf-core-provenancereport-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nf-core-provenancereport-summary":
    order: -1003

export_plots: false
disable_version_detection: true

custom_content:
  order:
    - input_samplesheet
    - file_checksums
    - pipeline_outputs
    - runtime_environment
    - "nf-core-provenancereport-r-session-info"

custom_data:
  input_samplesheet:
    section_name: "Input Samplesheet"
    description: "The identifiers and source paths supplied to this pipeline run."
    plot_type: "table"
    file_format: "csv"
    headers:
      path:
        title: Source path
  file_checksums:
    id: "file_checksums"
    section_name: "File Checksums"
    description: "MD5 checksums for every file listed in the input samplesheet and the rendered Quarto report."
    plot_type: "table"
    file_format: "tsv"
    pconfig:
      id: "file_checksums_table"
      col1_header: "File"
    headers:
      md5:
        title: MD5
        description: MD5 checksum
  pipeline_outputs:
    section_name: "Pipeline Outputs"
    description: "Published files generated by the pipeline and their output paths."
    plot_type: "table"
    file_format: "tsv"
    headers:
      file:
        title: File
      output_path:
        title: Output path
  runtime_environment:
    section_name: "Report Runtime Environment"
    description: "Runtime environment used to render the Quarto report."
    plot_type: "table"
    file_format: "tsv"
    headers:
      field:
        title: Field
      value:
        title: Value

sp:
  input_samplesheet:
    fn: "samplesheet.csv"
  file_checksums:
    fn: "file_checksums_mqc.tsv"
  pipeline_outputs:
    fn: "pipeline_outputs_mqc.tsv"
  runtime_environment:
    fn: "runtime_environment_mqc.tsv"
